<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: darkred;
            font-family: Arial;
            text-align: center;
        }
        input{
            color: cadetblue;
            font-weight: 100;
            
        }
        label{
            font-size: 20px;
            font-family: Arial Narrow;
        }
        body{
            background-color: antiquewhite;
        }
        button {
            width: 100px;
            height: 25px;
            color: blue;
        }
        .div1{
           width: 50%;
        height: 400px;
        background-color:lightblue;
        border-radius: 10px;
        margin: 60px auto auto auto;
        padding: 20px;

        }
        div:hover{
            box-shadow: 0px 0px 20px red;
            border-radius:15px;
        }
        button:hover{
            box-shadow: 0px 0px 20px rgb(30, 7, 243);
            border-radius:15px;
        }
        div:active{
                     box-shadow: 0px 0px 20px rgb(171, 88, 127);
                     border-radius:35px;   
        }
        input:focus{
            border-color: blue;
        }
        

        
    </style>
</head>
<body>
    <from>
        <div class="div1">
        <h1>Login Page</h1>
        
        <label>Name:</label>
        <input type="text"
        name="Name"
        placeholder="enter the name " required/><br><br>

        <label>Password:</label>
        <input type="password"
        name="password"
        placeholder="enter the password " required/><br><br>

        <label>Email:</label>
        <input type="email"
        name="email" 
        placeholder="enter the email "required/><br><br>

        <button name="btn_submit"
        id="btn_submit"
        value="submit">Submit</button>
        </div>

    </from>
</body>
</html>
